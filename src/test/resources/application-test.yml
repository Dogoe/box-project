# src/test/resources/application-test.yml

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
app:
  mail:
    # Tests never talk to an SMTP server; notifier behavior is tested with a mocked EmailService.
    enabled: false
  rate-limit:
    # Tests share one in-memory limiter per Spring context; RateLimitTest turns it back on.
    enabled: false
  storage:
    # Never talk to the real bucket from tests, even if a developer's .env has the keys.
    endpoint: ""
    access-key-id: ""
    secret-access-key: ""
    public-base-url: ""
