# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Keep secrets OUT of this file (it's committed to git): pass them as environment variables.
# Each ${VAR:default} below reads the env var VAR and falls back to the default after the colon.

spring:
  mail:
    # Gmail (with an App Password):  smtp.gmail.com, port 587
    # Brevo:                         smtp-relay.brevo.com, port 587
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Gmail: your full Gmail address.  Brevo: the "SMTP login" shown in Brevo (not your email).
    username: ${MAIL_USERNAME:CAMBIAR@gmail.com}
    # Gmail: the 16-character App Password.  Brevo: the SMTP key.  Set it ONLY as an env var.
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  # Your public site address, used for links inside the emails.
  public-base-url: ${PUBLIC_BASE_URL:https://CAMBIAR-tu-dominio.com}
  mail:
    enabled: ${MAIL_ENABLED:true}
    # Must be an address your SMTP account is allowed to send from
    # (Gmail: the same Gmail address; Brevo: a verified sender or domain).
    from: ${MAIL_FROM:Baja Solar Supply <CAMBIAR@gmail.com>}

  # Product/kit photos (Cloudflare R2) are configured in application.yml from these env vars:
  #   R2_ENDPOINT          https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  #   R2_BUCKET            box-app-images
  #   R2_ACCESS_KEY_ID     from the R2 API token  (secret: env var only)
  #   R2_SECRET_ACCESS_KEY from the R2 API token  (secret: env var only)
  #   R2_PUBLIC_URL        https://pub-xxxx.r2.dev for now, later https://imagenes.<tu-dominio>

server:
  # The rate limits count attempts per client IP. Behind a hosting proxy / load balancer every
  # request would otherwise look like it comes from the proxy, so read the real IP from its
  # X-Forwarded-For header. "native" only trusts that header when the request comes from a
  # private-network address (10.x, 192.168.x, 172.16-31.x, 127.x), i.e. from the platform's proxy,
  # so visitors can't fake it. If the app is exposed directly with no proxy, it's harmless.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
