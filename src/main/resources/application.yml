# Shared settings. Defaults here are for local development only; production (profile "prod",
# application-prod.yml) requires every secret as an environment variable. See .env.example.

server:
  # Hosting platforms (Render...) tell the app which port to listen on.
  port: ${PORT:8080}

spring:
  config:
    # Local secrets (R2 keys...) can live in a .env file at the project root, one KEY=value per
    # line; it's git-ignored. Real environment variables still win over it.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Admin photo uploads; they're resized to web size before being stored.
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbbox}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Options: none, validate, update, create, create-drop
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Without MAIL_* variables, development uses MailHog, which captures every email without
  # delivering it (UI on http://localhost:8025). To send real emails from your machine (e.g. with
  # Brevo), put MAIL_HOST, MAIL_PORT, MAIL_USERNAME and MAIL_PASSWORD in your .env (.env.example).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Stays false: the mail client still logs in whenever MAIL_USERNAME/MAIL_PASSWORD are set
          # (Brevo, Gmail), and MailHog needs no login.
          auth: false
          starttls:
            # Encrypts when the server offers it (Brevo, Gmail); MailHog doesn't, so it's skipped.
            enable: true
          # Fail fast instead of tying up a thread when the SMTP server is unreachable.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Absolute base used for links inside emails (customer order page, admin).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    # false skips sending entirely (orders still work); emails are only ever a notification.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:Baja Solar Supply <pedidos@bajasolarsupply.com>}
  rate-limit:
    # Caps login attempts, sign-ups, password-reset emails and orders per IP/email (see RateLimit).
    # Answers 429 "Intenta de nuevo en N minutos" when exceeded.
    enabled: true

  storage:
    # Product and kit photos: Cloudflare R2 (S3-compatible). Set these as environment variables, or
    # in a local .env file (see .env.example). While any is empty, the admin just pastes image links.
    endpoint: ${R2_ENDPOINT:}
    region: auto
    bucket: ${R2_BUCKET:box-app-images}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-base-url: ${R2_PUBLIC_URL:}

jwt:
  # Signs login sessions. This default is public (it's in git) and only for local development;
  # production refuses to start without its own JWT_SECRET.
  secret: ${JWT_SECRET:K0zDf0M5GyPlZtX7RhV0I5uPzZsZ3YgYV7Z7XgWyfL0=}
  expiration-ms: 43_200_000

admin:
  bootstrap:
    # Created on startup only if no user with this email exists yet (changing these later does
    # not change an existing admin). Production requires ADMIN_BOOTSTRAP_EMAIL / _PASSWORD.
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@bajasolarsupply.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
