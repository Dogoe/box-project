spring:

  security:
    user:
      name: testDev
      password: admin
  datasource:
    url: jdbc:postgresql://localhost:5432/dbbox
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Options: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Development: MailHog captures every email without delivering it (UI on http://localhost:8025).
  # Production SMTP settings live in application-prod.yml.
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Fail fast instead of tying up a thread when the SMTP server is unreachable.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Absolute base used for links inside emails (customer order page, admin).
  public-base-url: http://localhost:8080
  mail:
    # false skips sending entirely (orders still work); emails are only ever a notification.
    enabled: true
    from: "Baja Solar Supply <pedidos@bajasolarsupply.local>"
  rate-limit:
    # Caps login attempts, sign-ups, password-reset emails and orders per IP/email (see RateLimit).
    # Answers 429 "Intenta de nuevo en N minutos" when exceeded.
    enabled: true

jwt:
  secret: K0zDf0M5GyPlZtX7RhV0I5uPzZsZ3YgYV7Z7XgWyfL0=
  expiration-ms: 43_200_000

admin:
  bootstrap:
    # Seeded on startup if no user with this email exists yet, so the catalog
    # admin panel (/admin) is reachable out of the box. Override both via
    # ADMIN_BOOTSTRAP_EMAIL / ADMIN_BOOTSTRAP_PASSWORD env vars before
    # deploying anywhere the default password would be a real risk.
    email: admin@bajasolarsupply.com
    password: admin123

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
