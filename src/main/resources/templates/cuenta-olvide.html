<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Baja Solar Supply</title>

    <th:block th:replace="~{fragments/layout :: commonHead}"></th:block>
</head>

<body class="storefront">

<th:block th:replace="~{fragments/layout :: header('', false)}"></th:block>


<section class="py-5">
    <div class="container" style="max-width: 480px;">
        <h1 class="fw-bold mb-3 fs-2">¿Olvidaste tu contraseña?</h1>
        <p class="text-secondary">Escribe el correo de tu cuenta y te enviaremos un link para crear una nueva. El link dura 1 hora.</p>
        <div id="forgot-alert" class="alert d-none" role="alert"></div>
        <form id="forgot-form" novalidate>
            <div class="mb-3">
                <label class="form-label small" for="forgot-email">Correo</label>
                <input type="email" class="form-control" id="forgot-email" maxlength="200" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-accent w-100" id="forgot-submit">Enviarme el link</button>
        </form>
        <div class="mt-3 small"><a href="/cuenta">Volver a entrar</a></div>
    </div>
</section>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>


<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script th:src="@{/js/cuenta-password.js}"></script>

</body>
</html>
