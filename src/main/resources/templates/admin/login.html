<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Baja Solar Supply Admin</title>

    <th:block th:replace="~{fragments/layout :: commonHead}"></th:block>
</head>

<body class="admin bg-body-tertiary">

<div class="position-absolute top-0 end-0 p-3">
    <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
</div>

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-1">Baja Solar Supply</h4>
            <p class="text-center text-muted mb-4">Panel de administración</p>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="admin-login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success">Ingresar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/admin-login.js}"></script>

</body>
</html>
