<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de conexión | Baja Solar Supply</title>
    <!-- Always light: it's a reference sheet meant to be printed. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body { background: #f1f5f9; color: #111827; }
        .diagram-toolbar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .diagram-page { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        .diagram-sheet { overflow-x: auto; }
        .diagram-sheet svg { display: block; width: 100%; height: auto; min-width: 900px; }
        .diagram-tables table { font-size: 0.85rem; }
        .diagram-tables td.num { font-size: 1.1rem; white-space: nowrap; }
        @media print {
            @page { size: letter landscape; margin: 8mm; }
            body { background: #fff; }
            .diagram-toolbar { display: none !important; }
            .diagram-page { border: 0; padding: 0; }
            .container-fluid { padding: 0 !important; }
            .diagram-sheet { overflow: visible; page-break-after: always; break-after: page; }
            .diagram-sheet svg { min-width: 0; }
            .diagram-tables table { font-size: 9pt; }
            .diagram-tables tr { break-inside: avoid; }
            .diagram-tables h2 { break-after: avoid; }
        }
    </style>
</head>
<body th:attr="data-kit-id=${kitId}">

<div class="diagram-toolbar py-2">
    <div class="container-fluid d-flex flex-wrap gap-2 align-items-center">
        <a href="/admin" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Admin</a>
        <strong class="me-auto" id="diagram-kit-name">Diagrama de conexión</strong>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="diagram-svg-btn" disabled>
            <i class="bi bi-download"></i> Descargar SVG
        </button>
        <button type="button" class="btn btn-primary btn-sm" id="diagram-print-btn" disabled>
            <i class="bi bi-printer"></i> Imprimir / guardar PDF
        </button>
    </div>
</div>

<div class="container-fluid py-3">
    <div class="diagram-page" id="diagram-root">
        <div class="text-center text-secondary py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Cargando diagrama...
        </div>
    </div>
</div>

<script th:src="@{/js/kit-diagram.js}"></script>
</body>
</html>
