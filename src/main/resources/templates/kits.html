<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kits Solares | Baja Solar Supply</title>

    <th:block th:replace="~{fragments/layout :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/kits.css}">
</head>

<body class="storefront">

<th:block th:replace="~{fragments/layout :: header('kits', false)}"></th:block>


<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<section class="py-5 bg-body-tertiary border-bottom">
    <div class="container text-center">
        <span class="badge badge-outline mb-2">SOLUCIONES COMPLETAS</span>
        <h1 class="fw-bold">Kits solares</h1>
        <p class="lead text-secondary mb-0">
            Paquetes de paneles, batería e inversor ya dimensionados juntos,
            con su capacidad y lo que pueden alimentar.
        </p>
        <a href="/kits/pdf" class="btn btn-ghost btn-sm mt-3" th:unless="${#lists.isEmpty(kits)}">
            <i class="bi bi-file-earmark-pdf"></i> Descargar catálogo en PDF
        </a>
    </div>
</section>


<!-- ========================================================= -->
<!-- KITS GRID (details, gallery and "qué puede alimentar" live on each kit's page) -->
<!-- ========================================================= -->

<section class="py-5">
    <div class="container" style="max-width: 1140px;">

        <div class="text-center text-secondary py-5" th:if="${#lists.isEmpty(kits)}">
            Aún no hay kits publicados.
        </div>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-4" th:each="kit : ${kits}">
                <div class="card h-100 kit-card overflow-hidden"
                     th:with="kitUrl=@{/kits/{id}/{slug}(id=${kit.id},slug=${kit.slug})}">
                    <a th:href="${kitUrl}" class="kit-picture d-block border-bottom" th:aria-label="'Ver ' + ${kit.name}">
                        <th:block th:replace="~{fragments/kit-picture :: picture(${kit})}"></th:block>
                    </a>
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold mb-1">
                            <a th:href="${kitUrl}" class="text-body text-decoration-none" th:text="${kit.name}">Kit</a>
                        </h5>
                        <p class="small text-secondary mb-2 text-truncate-2" th:text="${kit.description}">Descripción</p>
                        <div class="d-flex flex-wrap gap-3 small text-muted mb-3">
                            <span title="Paneles"><i class="bi bi-sun"></i> <span th:text="${kit.totalPanelArrayKwp} + ' kWp'">-</span></span>
                            <span title="Batería"><i class="bi bi-battery-full"></i> <span th:text="${kit.totalBatteryCapacityKwh} + ' kWh'">-</span></span>
                            <span title="Inversor"><i class="bi bi-lightning-charge"></i> <span th:text="${kit.totalInverterPowerKw} + ' kW'">-</span></span>
                        </div>
                        <div class="mt-auto">
                            <div class="fs-4 fw-bold mb-2" th:data-price-mxn="${kit.sellPrice}">$0.00</div>
                            <div class="d-flex gap-2">
                                <a th:href="${kitUrl}" class="btn btn-ghost btn-sm flex-fill">Ver detalles</a>
                                <button type="button" class="btn btn-accent btn-sm px-3" th:data-add-to-cart="${kit.id}" data-icon-only
                                        title="Agregar al carrito" aria-label="Agregar al carrito">
                                    <i class="bi bi-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>


<th:block th:replace="~{fragments/layout :: footer}"></th:block>


<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>

</body>
</html>
