<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | Baja Solar Supply</title>

    <th:block th:replace="~{fragments/layout :: commonHead}"></th:block>
</head>

<body class="storefront">

<th:block th:replace="~{fragments/layout :: header('', false)}"></th:block>


<section class="py-5">
    <div class="container" style="max-width: 480px;">
        <h1 class="fw-bold mb-3 fs-2">Crea una nueva contraseña</h1>
        <div th:if="${token == null or #strings.isEmpty(token)}" class="alert alert-warning">
            Este link no es válido. <a href="/cuenta/olvide">Pide uno nuevo</a>.
        </div>
        <th:block th:unless="${token == null or #strings.isEmpty(token)}">
            <div id="reset-alert" class="alert alert-danger d-none" role="alert"></div>
            <form id="reset-form" novalidate th:attr="data-token=${token}">
                <div class="mb-2">
                    <label class="form-label small" for="reset-password">Nueva contraseña</label>
                    <input type="password" class="form-control" id="reset-password" minlength="8" required autocomplete="new-password">
                    <div class="form-text">Mínimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label small" for="reset-confirm">Confírmala</label>
                    <input type="password" class="form-control" id="reset-confirm" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-accent w-100" id="reset-submit">Guardar y entrar</button>
            </form>
        </th:block>
    </div>
</section>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>


<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script th:src="@{/js/cuenta-password.js}"></script>

</body>
</html>
