<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | Baja Solar Supply</title>

    <!-- Bootstrap 5.3.8 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<!-- ========================================================= -->
<!-- NAVBAR -->
<!-- ========================================================= -->

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold fs-3" href="/home">
            Baja Solar<span>Supply</span>
        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="/home">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-success fw-semibold" href="/cotizacion">
                        <i class="bi bi-calculator"></i> Cotizador
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/kits">Kits</a>
                </li>

            </ul>

            <div class="d-flex align-items-center gap-3">
                <a href="/cuenta" class="btn btn-sm btn-outline-dark" aria-label="Mi cuenta">
                    <i class="bi bi-person"></i> <span data-account-label>Entrar</span>
                </a>

                <a href="/carrito" class="btn btn-sm btn-outline-success position-relative" aria-label="Carrito">
                    <i class="bi bi-cart3"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success d-none" data-cart-count>0</span>
                </a>

                <div class="btn-group btn-group-sm" role="group" aria-label="Región">
                    <button type="button" class="btn btn-outline-dark region-toggle-btn" data-lang="es">MX</button>
                    <button type="button" class="btn btn-outline-dark region-toggle-btn" data-lang="en">US</button>
                </div>
            </div>

        </div>
    </div>
</nav>


<section class="py-5">
    <div class="container" style="max-width: 480px;">
        <h1 class="fw-bold mb-3 fs-2">Crea una nueva contraseña</h1>
        <div th:if="${token == null or #strings.isEmpty(token)}" class="alert alert-warning">
            Este link no es válido. <a href="/cuenta/olvide">Pide uno nuevo</a>.
        </div>
        <th:block th:unless="${token == null or #strings.isEmpty(token)}">
            <div id="reset-alert" class="alert alert-danger d-none" role="alert"></div>
            <form id="reset-form" novalidate th:attr="data-token=${token}">
                <div class="mb-2">
                    <label class="form-label small" for="reset-password">Nueva contraseña</label>
                    <input type="password" class="form-control" id="reset-password" minlength="8" required autocomplete="new-password">
                    <div class="form-text">Mínimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label small" for="reset-confirm">Confírmala</label>
                    <input type="password" class="form-control" id="reset-confirm" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-success w-100" id="reset-submit">Guardar y entrar</button>
            </form>
        </th:block>
    </div>
</section>

<!-- ========================================================= -->
<!-- FOOTER -->
<!-- ========================================================= -->

<footer class="footer bg-dark text-white-50 py-4 mt-5">
    <div class="container text-center">
        <small>© 2026 Baja Solar Supply. Todos los derechos reservados.</small>
    </div>
</footer>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script th:src="@{/js/region.js}"></script>
<script th:src="@{/js/account.js}"></script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/cuenta-password.js}"></script>

</body>
</html>
