<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirma tu correo</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Helvetica,Arial,sans-serif;color:#212529;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <h2 style="margin:0 0 12px 0;color:#198754;">Baja Solar Supply</h2>
    <p style="font-size:16px;">Hola <span th:text="${fullName}">Cliente</span>, gracias por crear tu cuenta.</p>
    <p>Confirma tu correo para terminar. Así también agregamos a tu cuenta los pedidos que hayas hecho antes con este correo.</p>
    <p style="margin:24px 0;">
        <a th:href="${link}" style="background:#198754;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">
            Confirmar mi correo
        </a>
    </p>
    <p style="font-size:12px;color:#6c757d;">El link vence en 48 horas. Si no creaste esta cuenta, ignora este correo.</p>
</div>
</body>
</html>
