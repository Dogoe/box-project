<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo pedido</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Helvetica,Arial,sans-serif;color:#212529;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <h2 style="margin:0 0 12px 0;">Nuevo pedido <span th:text="${order.folio}">BSS-XXXXXXXX</span></h2>

    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;">
        <tr><td style="padding:3px 0;width:110px;color:#6c757d;">Cliente</td><td th:text="${order.customerName}">-</td></tr>
        <tr><td style="padding:3px 0;color:#6c757d;">Teléfono</td><td th:text="${order.customerPhone}">-</td></tr>
        <tr th:if="${order.customerEmail != null}"><td style="padding:3px 0;color:#6c757d;">Correo</td><td th:text="${order.customerEmail}">-</td></tr>
        <tr><td style="padding:3px 0;color:#6c757d;">Dirección</td><td th:text="${order.fullAddress}">-</td></tr>
        <tr th:if="${order.addressReferences != null}"><td style="padding:3px 0;color:#6c757d;">Referencias</td><td th:text="${order.addressReferences}">-</td></tr>
        <tr th:if="${order.notes != null}"><td style="padding:3px 0;color:#6c757d;">Notas</td><td th:text="${order.notes}">-</td></tr>
    </table>

    <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr th:each="item : ${order.items}">
            <td style="padding:6px 0;border-bottom:1px solid #e9ecef;" th:text="${item.quantity} + ' × ' + ${item.kitName}">1 × Kit</td>
            <td style="padding:6px 0;border-bottom:1px solid #e9ecef;text-align:right;"
                th:text="'$' + ${#numbers.formatDecimal(item.lineTotalMxn, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
        </tr>
        <tr>
            <td style="padding:8px 0;font-weight:bold;">Total</td>
            <td style="padding:8px 0;font-weight:bold;text-align:right;"
                th:text="'$' + ${#numbers.formatDecimal(order.totalMxn, 1, 'COMMA', 2, 'POINT')} + ' MXN'">$0.00 MXN</td>
        </tr>
    </table>

    <p style="margin:24px 0 0 0;">
        <a th:href="${adminUrl}" style="background:#212529;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">
            Abrir el admin
        </a>
    </p>
</div>
</body>
</html>
