<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablece tu contraseña</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Helvetica,Arial,sans-serif;color:#212529;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <h2 style="margin:0 0 12px 0;color:#198754;">Baja Solar Supply</h2>
    <p style="font-size:16px;">Hola <span th:text="${fullName}">Cliente</span>,</p>
    <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta.</p>
    <p style="margin:24px 0;">
        <a th:href="${link}" style="background:#198754;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">
            Crear nueva contraseña
        </a>
    </p>
    <p style="font-size:12px;color:#6c757d;">El link vence en 1 hora y solo se puede usar una vez. Si no lo pediste, ignora este correo: tu contraseña no cambia.</p>
</div>
</body>
</html>
