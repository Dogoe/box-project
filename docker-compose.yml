
services:
  app:
    build: .
    container_name: springboot-app
    ports:
      - "8080:8080"
      - "5005:5005"   # Debug port
    environment:
      # Local development: debug port 5005 (IntelliJ "Remote JVM Debug"). Never set this in production.
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dbbox
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      # Photo storage (Cloudflare R2): docker compose takes these from the .env file next to this one.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-box-app-images}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - app-net
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: dbbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
